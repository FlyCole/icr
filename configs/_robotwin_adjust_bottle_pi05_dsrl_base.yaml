# Shared architecture, FP32 SAC heads, and the canonical 400-iteration budget.
defaults:
- env/robotwin_adjust_bottle@env.train
- env/robotwin_adjust_bottle@env.eval
- model/pi0_5@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0-1
runner:
  task_type: embodied
  logger:
    log_path: /home/yifei/icr/outputs/dsrl_sim_v2_large_s1234
    project_name: rlinf
    experiment_name: pi05_dsrl_v2_large
    logger_backends:
    - tensorboard
  max_epochs: 400
  max_steps: 400
  only_eval: false
  val_check_interval: -1
  save_interval: 400
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: false
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 20
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  agg_q: mean
  actor_agg_q: mean
  backup_entropy: false
  critic_subsample_size: 0
  critic_actor_ratio: 1
  bootstrap_type: standard
  gamma: 0.999
  tau: 0.005
  sac_reward_aggregation: sum
  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.01
    target_entropy: -16
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    filter_terminal_padding: false
    cache_size: 512
    sample_window_size: 512
    min_buffer_size: 25
    auto_save: false
    prefetch_size: 2
  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 25
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: EnvGroup
  enable_offload: false
  train:
    total_num_envs: 2
    rollout_epoch: 4
    auto_reset: false
    ignore_terminations: false
    reward_coef: 1.0
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    group_size: 1
    assets_path: /home/yifei/icr/third_party/robotwin
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/train_seeds.json
    center_crop: false
    skip_intermediate_renders: true
    video_cfg:
      save_video: false
    task_config:
      render_denoiser: none
      render_shader: default
      single_thread_render: true
      embodiment:
      - aloha-agilex
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
  eval:
    total_num_envs: 2
    rollout_epoch: 1
    auto_reset: true
    ignore_terminations: true
    use_fixed_reset_state_ids: true
    is_eval: true
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    group_size: 1
    assets_path: /home/yifei/icr/third_party/robotwin
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/eval_seeds.json
    center_crop: false
    skip_intermediate_renders: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config: ${env.train.task_config}
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  collect_final_values: false
  model:
    model_path: ${actor.model.model_path}
    precision: bf16
    openpi:
      dsrl_head_precision: fp32
      dsrl_eval_noise_mode: policy
actor:
  group_name: ActorGroup
  training_backend: fsdp
  dsrl_compact_checkpoint: true
  micro_batch_size: 32
  global_batch_size: 128
  seed: 1234
  enable_offload: false
  model:
    model_path: /home/yifei/icr/checkpoints/RLinf-Pi05-RoboTwin-SFT-adjust_bottle
    precision: fp32
    num_action_chunks: 50
    action_dim: 14
    num_steps: 5
    add_value_head: false
    add_q_head: true
    openpi_data:
      norm_stats_path: /home/yifei/icr/checkpoints/RLinf-Pi05-RoboTwin-SFT-adjust_bottle/physical-intelligence/robotwin/norm_stats.json
    openpi:
      task: dsrl
      config_name: pi05_aloha_robotwin
      num_images_in_input: 3
      embed_dtype: bf16
      dsrl_state_dim: 14
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
      torch_compile: false
      dsrl_head_precision: fp32
      dsrl_eval_noise_mode: policy
  optim:
    lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5
  critic_optim:
    lr: 0.0003
    clip_grad: 10.0
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    save_full_model_weights: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
      cast_forward_inputs: false
      cast_root_forward_inputs: false
    wrappers:
      projections:
        module_names:
        - action_*proj
        - '*time_mlp_*'
      norms:
        module_classes:
        - RMSNorm
      vision_embedding:
        module_names:
        - img
        - img.stem
      dsrl_heads:
        module_names:
        - dsrl_action_noise_net
        - actor_image_encoder
        - actor_state_encoder
        - critic_image_encoder
        - critic_state_encoder
        - q_head
    mixed_precision_policies:
      fp32:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
      fp32_preserve_inputs:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
        cast_forward_inputs: false
    mixed_precision_rules:
      projections: fp32
      norms: fp32_preserve_inputs
      vision_embedding: fp32_preserve_inputs
      dsrl_heads: fp32
reward:
  use_reward_model: false
critic:
  use_critic_model: false
