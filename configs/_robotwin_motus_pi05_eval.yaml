# Shared native-success evaluation of the frozen Motus policy; public configs select tasks.
defaults:
  - /env/robotwin_adjust_bottle@env.eval
  - /model/pi0_5@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    env, rollout: 0-1

runner:
  task_type: embodied_eval
  logger:
    project_name: rlinf
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: EnvGroup
  enable_offload: true
  eval:
    total_num_envs: 2
    rollout_epoch: 75
    seed: 0
    auto_reset: true
    ignore_terminations: true
    use_fixed_reset_state_ids: false
    is_eval: true
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    group_size: 1
    reward_coef: 1.0
    center_crop: false
    assets_path: /home/yifei/icr/third_party/robotwin
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/eval_seeds.json
    skip_intermediate_renders: false
    video_cfg:
      save_video: false
      info_on_video: false
      fps: 20
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      step_lim: 200
      render_shader: default
      render_denoiser: none
      single_thread_render: true
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: /home/yifei/icr/checkpoints/Motus-Pi05-RoboTwin2
    precision: bf16
    num_action_chunks: 20
    action_dim: 14
    add_value_head: false
    num_steps: 5
    openpi_data:
      norm_stats_path: /home/yifei/icr/checkpoints/Motus-Pi05-RoboTwin2/assets/pi0.5_clean_randomize_joint_training/norm_stats.json
      adapt_to_pi: true
      extra_delta_transform: true
    openpi:
      task: eval
      config_name: pi05_aloha_robotwin
      num_images_in_input: 3
      torch_compile: false
      action_horizon: 32
      action_chunk: 20

