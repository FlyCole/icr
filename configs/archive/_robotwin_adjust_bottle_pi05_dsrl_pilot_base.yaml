# @package _global_
# Controlled simulator-reward DSRL pilot: corrected optimization, lower entropy.
defaults:
  - /archive/_robotwin_adjust_bottle_pi05_dsrl_legacy_base
  - _self_

runner:
  logger:
    log_path: /home/yifei/icr/outputs/dsrl_sim_v2_alpha001_s1234
    experiment_name: pi05_dsrl_v2
  max_epochs: 200
  max_steps: 200
  val_check_interval: -1
  # One final checkpoint avoids another duplicate 13 GiB frozen decoder.
  save_interval: 200
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 20
  entropy_tuning:
    # A task-specific test for sparse +1 rewards, not the official LIBERO default.
    alpha_type: fixed_alpha
    initial_alpha: 0.01
  replay_buffer:
    min_buffer_size: 10
  # This is a received-replay-batch threshold, not critic-only optimizer steps.
  train_actor_steps: 10

actor:
  model:
    openpi:
      dsrl_head_precision: fp32
      dsrl_eval_noise_mode: policy
  fsdp_config:
    wrappers:
      dsrl_heads:
        module_names:
          - dsrl_action_noise_net
          - actor_image_encoder
          - actor_state_encoder
          - critic_image_encoder
          - critic_state_encoder
          - q_head
    mixed_precision_rules:
      dsrl_heads: fp32

rollout:
  model:
    openpi:
      dsrl_head_precision: fp32
      dsrl_eval_noise_mode: policy

reward:
  use_reward_model: false
