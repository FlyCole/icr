# @package _global_
# Evaluate the learned noise policy together with its frozen pi0.5 decoder.
defaults:
- /env/robotwin_adjust_bottle@env.eval
- /model/pi0_5@rollout.model
- override /hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config
cluster:
  num_nodes: 1
  component_placement:
    env, rollout: 0-1
runner:
  task_type: embodied_eval
  logger:
    log_path: /home/yifei/icr/outputs/dsrl_eval_150
    project_name: rlinf
    experiment_name: pi05_dsrl_eval
    logger_backends:
    - tensorboard
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
env:
  group_name: EnvGroup
  enable_offload: true
  eval:
    total_num_envs: 2
    rollout_epoch: 75
    auto_reset: true
    ignore_terminations: true
    use_fixed_reset_state_ids: false
    is_eval: true
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    group_size: 1
    reward_coef: 1.0
    center_crop: false
    assets_path: /home/yifei/icr/third_party/robotwin
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/eval_seeds.json
    skip_intermediate_renders: false
    video_cfg:
      save_video: true
      info_on_video: false
      fps: 20
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      step_lim: 200
      embodiment:
      - aloha-agilex
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      render_denoiser: none
      render_shader: default
      single_thread_render: true
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    # Retained final Robometer-trained checkpoint; old smoke checkpoints retired.
    model_path: /home/yifei/icr/outputs/robometer_dsrl_benchmark_s1234_fixed/pi05_dsrl_robometer/checkpoints/global_step_200
    precision: bf16
    num_action_chunks: 50
    action_dim: 14
    add_value_head: false
    num_steps: 5
    openpi_data:
      norm_stats_path: /home/yifei/icr/checkpoints/RLinf-Pi05-RoboTwin-SFT-adjust_bottle/physical-intelligence/robotwin/norm_stats.json
    openpi:
      task: dsrl
      config_name: pi05_aloha_robotwin
      num_images_in_input: 3
      noise_level: 0.3
      detach_critic_input: true
      torch_compile: false
      dsrl_state_dim: 14
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
    add_q_head: true
