# Matched 400-iteration DSRL training; reward source robometer.
defaults:
  - /_robotwin_motus_pi05_dsrl
  - _self_

hydra:
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config

runner:
  logger:
    log_path: /home/yifei/icr/outputs/motus_multitask/adjust_bottle/robometer_train
    experiment_name: pi05_motus_adjust_bottle_dsrl_robometer

env:
  train:
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    task_config:
      task_name: adjust_bottle
      step_lim: 200
  eval:
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    task_config:
      task_name: adjust_bottle
      step_lim: 200

reward:
  model:
    server_url: http://127.0.0.1:8000

