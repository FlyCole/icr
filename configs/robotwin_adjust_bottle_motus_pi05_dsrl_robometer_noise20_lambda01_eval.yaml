# Native 150-seed evaluation of this lambda0.1 run's own final controller.
defaults:
  - /_robotwin_motus_pi05_dsrl_noise20_eval
  - _self_

hydra:
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config

runner:
  logger:
    log_path: /home/yifei/icr/outputs/motus_noise20_adjust_bottle_lambda01/adjust_bottle/robometer_eval
    experiment_name: pi05_motus_adjust_bottle_dsrl_robometer_noise20_eval

env:
  eval:
    context_match_mode: fixed
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    video_cfg:
      save_video: false
    task_config:
      task_name: adjust_bottle
      step_lim: 200
      wrist_camera_capture: chunk_end

reward:
  use_reward_model: false

rollout:
  model:
    model_path: /home/yifei/icr/outputs/motus_noise20_adjust_bottle_lambda01/adjust_bottle/robometer_train/pi05_motus_adjust_bottle_dsrl_robometer_noise20/checkpoints/global_step_400
