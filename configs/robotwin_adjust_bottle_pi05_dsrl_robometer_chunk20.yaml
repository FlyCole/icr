# Fresh Robometer control: decode 50 actions, execute 20, then observe and replan.
defaults:
  # Share the learned-reward recipe used by the matched ICON chunk-20 run.
  - /_robotwin_adjust_bottle_pi05_dsrl_learned_reward
  - _self_

hydra:
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config

runner:
  logger:
    log_path: /home/yifei/icr/outputs/robometer_dsrl_chunk20_large_s1234
    experiment_name: pi05_dsrl_robometer_chunk20_large
  max_epochs: 400
  max_steps: 400
  save_interval: 400
  val_check_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  train:
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    task_config:
      step_lim: 200
  eval:
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    task_config:
      step_lim: 200

actor:
  global_batch_size: 128
  micro_batch_size: 64
  model:
    num_action_chunks: 20
    openpi:
      # Preserve the pretrained network horizon and its normalization pipeline.
      action_horizon: 50
      action_chunk: 20

rollout:
  model:
    num_action_chunks: 20
    openpi:
      action_horizon: 50
      action_chunk: 20

algorithm:
  update_epoch: 50
  replay_buffer:
    filter_terminal_padding: true

reward:
  model:
    server_url: http://127.0.0.1:8000
    num_action_chunks: 20
    reward_mode: single_stage
    progress_penalty_weight: 1.0  # Preserve this historical reward recipe.
    # One unnormalized p - 1 + native_success reward per executed chunk.
    reward_scale: 1.0
