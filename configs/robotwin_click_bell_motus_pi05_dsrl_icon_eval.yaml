# Evaluate only this task's completed learned controller on its held-out 150 seeds.
defaults:
  - /_robotwin_motus_pi05_dsrl_eval
  - _self_

hydra:
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config

runner:
  logger:
    log_path: /home/yifei/icr/outputs/motus_multitask/click_bell/icon_eval
    experiment_name: pi05_motus_click_bell_dsrl_icon_eval

env:
  eval:
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    task_config:
      task_name: click_bell
      step_lim: 400

rollout:
  model:
    model_path: /home/yifei/icr/outputs/motus_multitask/click_bell/icon_train/pi05_motus_click_bell_dsrl_icon/checkpoints/global_step_400

