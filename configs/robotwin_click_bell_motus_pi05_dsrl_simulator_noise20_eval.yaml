# Native-success evaluation of the fresh final click_bell simulator controller.
defaults:
  - /_robotwin_motus_pi05_dsrl_noise20_eval
  - _self_

hydra:
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config

runner:
  logger:
    log_path: /home/yifei/icr/outputs/motus_noise20_click_bell/click_bell/simulator_eval
    experiment_name: pi05_motus_click_bell_dsrl_simulator_noise20_eval

env:
  eval:
    context_match_mode: fixed
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    video_cfg:
      save_video: false
    task_config:
      task_name: click_bell
      step_lim: 400
      wrist_camera_capture: chunk_end

reward:
  use_reward_model: false

rollout:
  model:
    model_path: /home/yifei/icr/outputs/motus_noise20_click_bell/click_bell/simulator_train/pi05_motus_click_bell_dsrl_simulator_noise20/checkpoints/global_step_400
