# Evaluate only this task's completed learned controller on its held-out 150 seeds.
defaults:
  - /_robotwin_motus_pi05_dsrl_eval
  - _self_

hydra:
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config

runner:
  logger:
    log_path: /home/yifei/icr/outputs/motus_multitask/move_can_pot/robometer_eval
    experiment_name: pi05_motus_move_can_pot_dsrl_robometer_eval

env:
  eval:
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    task_config:
      task_name: move_can_pot
      step_lim: 200

rollout:
  model:
    model_path: /home/yifei/icr/outputs/motus_multitask/move_can_pot/robometer_train/pi05_motus_move_can_pot_dsrl_robometer/checkpoints/global_step_400

