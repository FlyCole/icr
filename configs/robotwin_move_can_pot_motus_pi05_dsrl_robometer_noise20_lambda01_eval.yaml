# Native-success evaluation of the fresh final move_can_pot Robometer controller.
defaults:
  - /_robotwin_motus_pi05_dsrl_noise20_eval
  - _self_

hydra:
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config

runner:
  logger:
    log_path: /home/yifei/icr/outputs/motus_noise20_move_can_pot_lambda01/move_can_pot/robometer_eval
    experiment_name: pi05_motus_move_can_pot_dsrl_robometer_noise20_eval

env:
  eval:
    context_match_mode: fixed
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    video_cfg:
      save_video: false
    task_config:
      task_name: move_can_pot
      step_lim: 400
      wrist_camera_capture: chunk_end

reward:
  use_reward_model: false

rollout:
  model:
    model_path: /home/yifei/icr/outputs/motus_noise20_move_can_pot_lambda01/move_can_pot/robometer_train/pi05_motus_move_can_pot_dsrl_robometer_noise20/checkpoints/global_step_400
