# Saved resolved configuration; learning values are unchanged.
# Original configuration SHA256: 5991a0f282812d43962a354556214811b3466a3e6d4b96d458e09e6b6833fbc0
# Set ICR_REPO_ROOT and a fresh ICR_RUN_ROOT before using this snapshot.
# Trained-policy evaluation also requires ICR_EVAL_CHECKPOINT.
env:
  eval:
    env_type: robotwin
    total_num_envs: 2
    auto_reset: true
    ignore_terminations: true
    reward_coef: 1.0
    use_custom_reward: true
    use_rel_reward: true
    center_crop: false
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: false
    max_steps_per_rollout_epoch: 400
    max_episode_steps: 400
    is_eval: true
    assets_path: ${oc.env:ICR_REPO_ROOT}/third_party/robotwin
    seeds_path: ${oc.env:ICR_REPO_ROOT}/third_party/rlinf/rlinf/envs/sim/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: false
      info_on_video: false
      video_base_dir: ${oc.env:ICR_RUN_ROOT}/video/eval
      fps: 20
    enable_offload: false
    task_config:
      task_name: click_bell
      step_lim: 400
      planner_backend: mplib
      render_freq: 0
      episode_num: 100
      use_seed: false
      save_freq: 15
      embodiment:
      - aloha-agilex
      language_num: 100
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      camera:
        head_camera_type: D435
        wrist_camera_type: D435
        collect_head_camera: true
        collect_wrist_camera: true
      data_type:
        rgb: true
        third_view: false
        depth: false
        pointcloud: false
        observer: false
        endpose: false
        qpos: true
        mesh_segmentation: false
        actor_segmentation: false
      pcd_down_sample_num: 1024
      pcd_crop: true
      save_path: ./data
      clear_cache_freq: 1
      collect_data: true
      eval_video_log: true
      render_shader: default
      render_denoiser: none
      single_thread_render: true
    rollout_epoch: 75
    skip_intermediate_renders: false
  group_name: EnvGroup
  enable_offload: true
rollout:
  model:
    model_type: openpi
    precision: bf16
    pi05: true
    is_lora: false
    lora_rank: 32
    num_action_chunks: 20
    action_dim: 14
    use_proprio: true
    num_steps: 5
    add_value_head: false
    openpi:
      task: eval
      config_name: pi05_aloha_robotwin
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 20
      num_steps: 5
      train_expert_only: true
      action_env_dim: 14
      noise_method: flow_sde
      add_value_head: false
      value_after_vlm: false
      value_vlm_mode: mean_token
      detach_critic_input: false
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      torch_compile: false
      action_horizon: 32
    model_path: ${oc.env:ICR_REPO_ROOT}/checkpoints/Motus-Pi05-RoboTwin2
    openpi_data:
      norm_stats_path: ${oc.env:ICR_REPO_ROOT}/checkpoints/Motus-Pi05-RoboTwin2/assets/pi0.5_clean_randomize_joint_training/norm_stats.json
      adapt_to_pi: true
      extra_delta_transform: true
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
cluster:
  num_nodes: 1
  component_placement:
    env, rollout: 0-1
  tracer:
    enable: false
runner:
  task_type: embodied_eval
  logger:
    project_name: rlinf
    logger_backends:
    - tensorboard
    log_path: ${oc.env:ICR_RUN_ROOT}
    experiment_name: pi05_motus_click_bell_sft_eval
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
  per_worker_log: false
  per_worker_log_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
