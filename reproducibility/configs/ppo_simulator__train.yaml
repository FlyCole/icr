actor:
  model:
    model_type: openpi
    precision: fp32
    pi05: true
    is_lora: false
    lora_rank: 32
    num_action_chunks: 50
    action_dim: 14
    use_proprio: true
    num_steps: 5
    add_value_head: true
    openpi:
      task: rl
      config_name: pi05_aloha_robotwin
      num_images_in_input: 3
      noise_level: 0.3
      action_chunk: 50
      num_steps: 5
      train_expert_only: true
      action_env_dim: 14
      noise_method: flow_sde
      add_value_head: true
      value_after_vlm: false
      value_vlm_mode: mean_token
      detach_critic_input: true
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      torch_compile: false
      embed_dtype: bf16
    model_path: ${oc.env:ICR_REPO_ROOT}/checkpoints/RLinf-Pi05-RoboTwin-SFT-adjust_bottle
    openpi_data:
      norm_stats_path: ${oc.env:ICR_REPO_ROOT}/checkpoints/RLinf-Pi05-RoboTwin-SFT-adjust_bottle/physical-intelligence/robotwin/norm_stats.json
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: true
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
      cast_forward_inputs: false
      cast_root_forward_inputs: false
    wrappers:
      projections:
        module_names:
        - action_*proj
        - '*time_mlp_*'
        - value_head
      norms:
        module_classes:
        - RMSNorm
      vision_embedding:
        module_names:
        - img
        - img.stem
    mixed_precision_policies:
      fp32:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
      fp32_preserve_inputs:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
        cast_forward_inputs: false
    mixed_precision_rules:
      projections: fp32
      norms: fp32_preserve_inputs
      vision_embedding: fp32_preserve_inputs
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
    gradient_checkpointing_use_reentrant: false
    save_full_model_weights: true
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 16
  seed: 1234
  enable_offload: true
  optim:
    lr: 5.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0-1
  tracer:
    enable: false
runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:ICR_RUN_ROOT}
    project_name: rlinf
    experiment_name: pi05_ppo
    logger_backends:
    - tensorboard
  max_epochs: 100
  max_steps: 100
  only_eval: false
  val_check_interval: -1
  save_interval: 100
  resume_dir: null
  ckpt_path: null
  per_worker_log: false
  per_worker_log_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 5
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:ICR_REPO_ROOT}/checkpoints/RLinf-Pi05-RoboTwin-SFT-adjust_bottle
    precision: bf16
reward:
  use_reward_model: false
  env_reward_weight: 1.0
  reward_weight: 0.0
critic:
  use_critic_model: false
