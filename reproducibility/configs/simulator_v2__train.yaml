actor:
  model:
    model_type: openpi
    precision: fp32
    pi05: true
    is_lora: false
    lora_rank: 32
    num_action_chunks: 50
    action_dim: 14
    use_proprio: true
    num_steps: 5
    add_value_head: false
    openpi:
      task: dsrl
      config_name: pi05_aloha_robotwin
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 50
      num_steps: 5
      train_expert_only: true
      action_env_dim: 14
      noise_method: flow_sde
      add_value_head: false
      value_after_vlm: false
      value_vlm_mode: mean_token
      detach_critic_input: false
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      torch_compile: false
      embed_dtype: bf16
      dsrl_state_dim: 14
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
      dsrl_head_precision: fp32
      dsrl_eval_noise_mode: policy
    model_path: ${oc.env:ICR_REPO_ROOT}/checkpoints/RLinf-Pi05-RoboTwin-SFT-adjust_bottle
    add_q_head: true
    openpi_data:
      norm_stats_path: ${oc.env:ICR_REPO_ROOT}/checkpoints/RLinf-Pi05-RoboTwin-SFT-adjust_bottle/physical-intelligence/robotwin/norm_stats.json
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
      cast_forward_inputs: false
      cast_root_forward_inputs: false
    wrappers:
      projections:
        module_names:
        - action_*proj
        - '*time_mlp_*'
      norms:
        module_classes:
        - RMSNorm
      vision_embedding:
        module_names:
        - img
        - img.stem
      dsrl_heads:
        module_names:
        - dsrl_action_noise_net
        - actor_image_encoder
        - actor_state_encoder
        - critic_image_encoder
        - critic_state_encoder
        - q_head
    mixed_precision_policies:
      fp32:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
      fp32_preserve_inputs:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
        cast_forward_inputs: false
    mixed_precision_rules:
      projections: fp32
      norms: fp32_preserve_inputs
      vision_embedding: fp32_preserve_inputs
      dsrl_heads: fp32
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
    save_full_model_weights: true
  group_name: ActorGroup
  training_backend: fsdp
  dsrl_compact_checkpoint: true
  micro_batch_size: 4
  global_batch_size: 16
  seed: 1234
  enable_offload: false
  optim:
    lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5
  critic_optim:
    lr: 0.0003
    clip_grad: 10.0
    lr_scheduler: torch_constant
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0-1
  tracer:
    enable: false
runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:ICR_RUN_ROOT}
    project_name: rlinf
    experiment_name: pi05_dsrl_v2
    logger_backends:
    - tensorboard
  max_epochs: 200
  max_steps: 200
  only_eval: false
  val_check_interval: -1
  save_interval: 200
  resume_dir: null
  ckpt_path: null
  per_worker_log: false
  per_worker_log_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
algorithm:
  normalize_advantages: false
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 20
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  agg_q: mean
  actor_agg_q: mean
  backup_entropy: false
  critic_subsample_size: 0
  critic_actor_ratio: 1
  bootstrap_type: standard
  gamma: 0.999
  tau: 0.005
  sac_reward_aggregation: sum
  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.01
    target_entropy: -16
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    cache_size: 2048
    sample_window_size: 2048
    min_buffer_size: 10
    auto_save: false
    prefetch_size: 2
  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 10
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  collect_final_values: false
  model:
    model_path: ${oc.env:ICR_REPO_ROOT}/checkpoints/RLinf-Pi05-RoboTwin-SFT-adjust_bottle
    precision: bf16
    openpi:
      dsrl_head_precision: fp32
      dsrl_eval_noise_mode: policy
reward:
  use_reward_model: false
critic:
  use_critic_model: false
